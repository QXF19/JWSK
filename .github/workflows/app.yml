name: App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          fetch-depth: 0
      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Write key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEYSTORE_ALIAS" ] || [ -z "$KEYSTORE_ALIAS_PASSWORD" ]; then
            echo "Signing secrets are not configured; using debug signing fallback."
            exit 0
          fi
          {
            printf 'KEYSTORE_PASSWORD=%s\n' "$KEYSTORE_PASSWORD"
            printf 'KEYSTORE_ALIAS=%s\n' "$KEYSTORE_ALIAS"
            printf 'KEYSTORE_ALIAS_PASSWORD=%s\n' "$KEYSTORE_ALIAS_PASSWORD"
            printf 'KEYSTORE_FILE=../key.jks\n'
          } > signing.properties
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > key.jks
      - name: Generate fallback signing key
        if: hashFiles('signing.properties') == ''
        run: |
          keytool -genkeypair -noprompt \
            -keystore ci-debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          {
            printf 'KEYSTORE_PASSWORD=android\n'
            printf 'KEYSTORE_ALIAS=androiddebugkey\n'
            printf 'KEYSTORE_ALIAS_PASSWORD=android\n'
            printf 'KEYSTORE_FILE=../ci-debug.keystore\n'
          } > signing.properties
      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --channel=3 --licenses > /dev/null || true
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          dependency-graph: generate-and-submit
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"
      - name: Build with Gradle
        id: buildWithGradle
        run: |
          echo 'android.sdk.channel=3' >> gradle.properties
          echo 'android.native.buildOutput=verbose' >> gradle.properties
          echo 'org.gradle.caching=true' >> gradle.properties
          echo 'org.gradle.parallel=true' >> gradle.properties
          ./gradlew :manager:assembleRelease
          release_path=$(find out/apk -maxdepth 1 -name 'JWSK-v*-release.apk' -print -quit)
          test -n "$release_path"
          release_name=$(basename "$release_path" .apk)
          echo "releaseName=$release_name" >> "$GITHUB_OUTPUT"
      - name: Upload release
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.buildWithGradle.outputs.releaseName }}
          path: "out"
          compression-level: 9

      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: out/apk/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
