name: JWSK signed release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable version tag
        type: string
        required: true
      publish:
        description: Publish after all release checks pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: jwsk-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
      - name: Require the validated native manager version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          python3 - <<'PY'
          import json, os, pathlib, re
          tag = os.environ['RELEASE_TAG']
          source = pathlib.Path('kernelsu/manager/build.gradle.kts').read_text()
          version = re.search(r'extra\["managerVersionName"\].*?\?: "([^"]+)"', source).group(1)
          assert version == tag[1:] and '-dev' not in version
          evidence = json.loads(pathlib.Path('docs/stable-validation.json').read_text())
          assert evidence['version'] == version and evidence['status'] == 'passed'
          assert set(evidence['root_backends']) == {'alpha', 'kernelsu'}
          assert evidence['alpha_cold_boot'] is True
          assert evidence['kernelsu_runtime'] is True
          assert evidence['kernelsu_cold_boot'] is True
          assert evidence['isolated_uid_grant_revoke'] == {'alpha': True, 'kernelsu': True}
          assert evidence['signing_sha256'] == '1f934155f4ffc1aeefb44faa15bdbef277ca4472435ed45e09fa583b9d67a76f'
          assert pathlib.Path(f'docs/release-notes-{tag}.md').is_file()
          PY
  native:
    needs: preflight
    uses: ./.github/workflows/jwsk-native.yml
    secrets: inherit
  publish:
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: JWSK-native-signed-development
          path: signed-manager
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify and publish signed native release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          (cd signed-manager && sha256sum -c SHA256SUMS)
          mapfile -t apks < <(find signed-manager -maxdepth 1 -name '*.apk')
          test "${#apks[@]}" = 1
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 'build-tools;37.0.0'
          signer="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          apk_version=$("$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging "${apks[0]}" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          test "$apk_version" = "${RELEASE_TAG#v}"
          if "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging "${apks[0]}" | grep -q '^application-debuggable'; then
            echo 'Refusing a debuggable public release' >&2
            exit 1
          fi
          "$signer" verify --verbose --print-certs "${apks[0]}" > signed-manager/certificate.txt
          grep -Fq '1f934155f4ffc1aeefb44faa15bdbef277ca4472435ed45e09fa583b9d67a76f' signed-manager/certificate.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' signed-manager/certificate.txt
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): false' signed-manager/certificate.txt
          "$signer" verify --min-sdk-version 24 --max-sdk-version 27 --verbose "${apks[0]}" | grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true'
          mkdir -p release
          cp "${apks[0]}" "release/JWSK-$RELEASE_TAG.apk"
          cp docs/stable-validation.json signed-manager/certificate.txt release/
          (cd release && sha256sum ./*.apk > SHA256SUMS)
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "JWSK $RELEASE_TAG" --notes-file "docs/release-notes-$RELEASE_TAG.md" release/*
          if [ "$PUBLISH" = true ]; then gh release edit "$RELEASE_TAG" --draft=false --latest; fi
