name: Historical ADB manager (manual only)

on:
  # Retained for historical-source recovery, never a native release candidate.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :manager:testDebugUnitTest :manager:assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: JWSK-debug
          path: out/apk/JWSK-v*-debug.apk
          if-no-files-found: error
