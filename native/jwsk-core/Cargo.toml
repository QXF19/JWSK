[package]
name = "jwsk-core"
version = "1.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Small memory-safe native helpers for the JWSK Android manager"

[lib]
name = "jwsk_core"
crate-type = ["cdylib"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
